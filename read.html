<script type="module">
import * as pdfjs from "./lib/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.mjs";

const { loadLibrary, store, ar, en, track, hits, bookPath } = window.Lib;
const $ = (id) => document.getElementById(id);
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function fail(msg) { $("loadMsg").textContent = msg; $("loadBar").parentElement.hidden = true; }

// ===== تحديد الكتاب =====
const params = new URLSearchParams(location.search);
const data = await loadLibrary();
let book = null;
if (params.get("id")) book = data.books.find((b) => b.id === params.get("id"));
else if (params.get("file")) book = data.books.find((b) => b.file === params.get("file"));
if (!book) { fail("لم يتم العثور على الكتاب"); throw new Error("book not found"); }

const siteName = (data.site.title || "المكتبة").replace(/[\u064B-\u0652]/g, "") + (data.site.author ? " — " + data.site.author : "");
document.title = book.title + " — " + siteName;
$("title").textContent = book.title; $("zTitle").textContent = book.title;
// تسجيل مشاهدة الكتاب
if (data.site.counter) track(data.site.counter, bookPath(book), book.title);
if (data.site.allowDownload) { const d = $("download"); d.href = book.file; d.hidden = false; }

// ===== فتح ملف PDF =====
let pdf;
try {
  const task = pdfjs.getDocument({ url: book.file, rangeChunkSize: 262144, disableAutoFetch: false });
  task.onProgress = ({ loaded, total }) => { if (total) $("loadBar").style.width = Math.min(100, (loaded / total) * 100) + "%"; };
  pdf = await task.promise;
} catch (e) { console.error(e); fail("تعذّر فتح الكتاب، حاول تحديث الصفحة"); throw e; }

const N = pdf.numPages;
const T = N + (N % 2);              // عدد عناصر الكتاب (زوجي دائماً)
const idxOf = (p) => T - p;         // ترتيب معكوس ليكون التقليب من اليمين لليسار
const pageOf = (i) => T - i;
const first = await pdf.getPage(1);
const vp1 = first.getViewport({ scale: 1 });
const RATIO = vp1.width / vp1.height;

$("total").textContent = ar(N);
$("slider").max = N;

// ===== عناصر الصفحات =====
const els = [];       // حسب الفهرس
for (let i = 0; i < T; i++) {
  const p = pageOf(i);
  const d = document.createElement("div");
  d.className = "pg";
  if (i === 0 || i === T - 1) d.dataset.density = "hard";
  if (p > N) d.classList.add("blank");
  else { const ph = document.createElement("div"); ph.className = "pg-ph"; ph.textContent = ar(p); d.appendChild(ph); }
  els.push(d);
}

// ===== حساب المقاس =====
let landscape = true, pageW = 300;
function measure() {
  const st = $("stage");
  const wide = st.clientWidth > 640;
  const availW = st.clientWidth - (wide ? 130 : 16);
  const availH = st.clientHeight - (wide ? 32 : 16);

const rendered = new Map(); // p -> width
const queue = []; let busy = false;

  if (p < 1 || p > N) return;
  const target = Math.round(pageW * DPR);
  const have = rendered.get(p);
  if (have && have >= target * 0.87) return;
  if (!queue.includes(p)) queue.push(p);

}
async function pump() {
  if (busy) return; busy = true;
  while (queue.length) {
    const p = queue.shift();
    const target = Math.round(pageW * DPR);
    try {
      const page = await pdf.getPage(p);
      const vp0 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: target / vp0.width });
      const c = document.createElement("canvas");
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      c.dir = "ltr";
      const ctx = c.getContext("2d", { alpha: false }); ctx.direction = "ltr";
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);

      drawAnn(ctx, p, c.width, c.height);
      const el = els[idxOf(p)];
      el.querySelectorAll("canvas,.pg-ph").forEach((n) => n.remove());
      el.appendChild(c);
      rendered.set(p, target);
    } catch (e) { console.warn("render", p, e); }
  }

}

function makeSpread() {
  const flip = new St.PageFlip($("book"), {
    width: Math.round(vp1.width), height: Math.round(vp1.height),

    minWidth: 50, maxWidth: 4000, minHeight: 50, maxHeight: 6000,

  const fit = () => { settings.minWidth = pageW * 0.9; $("book").style.minWidth = "0"; $("book").style.minHeight = "0"; };
  fit();
  flip.loadFromHTML(els);
  let last = "";
  flip.on("changeState", (e) => { if (e.data === "flipping" && last !== "flipping") emitTurn(); last = e.data; });
  flip.on("flip", emitChange);
  flip.on("changeOrientation", emitChange);
  return {
    ready: (cb) => flip.on("init", cb),
    visible() {
      const i = flip.getCurrentPageIndex();
      if (i === 0 || i === T - 1 || flip.getOrientation() === "portrait") return [pageOf(i)].filter((p) => p <= N);
      const s = i % 2 ? i : i - 1;

function makeSingle() {
  $("book").remove();
  const box = document.createElement("div"); box.className = "sp";
  $("sizer").appendChild(box);
  const shade = document.createElement("div"); shade.className = "sp-shade";
  const size = () => { box.style.width = pageW + "px"; box.style.height = Math.round(pageW / RATIO) + "px"; };
  size();
  let cur = startP, busyAnim = false;
  const el = (p) => els[idxOf(p)];
  function mountOnly(p) {
    box.replaceChildren(el(p));

  }
  // dir = 1 للأمام (الصفحة الحالية تنقلب من حافتها اليسرى نحو اليمين)، -1 للخلف
  function setup(dir) {

    under.style.zIndex = 1; under.style.transform = "";

  }
  function draw(st, prog) {

    st.top.style.transform = "rotateY(" + ang + "deg)";
    st.top.style.filter = "brightness(" + (1 - Math.min(ang, 90) / 90 * 0.22) + ")";
    shade.style.opacity = String(Math.sin(Math.min(ang, 180) * Math.PI / 180) * 0.45);
  }
  function finish(st, commit, ms = 420) {

    shade.style.transition = "opacity " + ms + "ms";

      st.top.style.transform = "rotateY(" + target + "deg)";
      st.top.style.filter = "brightness(1)";
      shade.style.opacity = "0";

    if (commit) emitTurn();
    setTimeout(() => {

      if (commit) emitChange();
    }, ms + 30);
  }
  function turn(dir) {

    finish(st, true, 520);

  let d = null;
  box.addEventListener("pointerdown", (e) => {

      if (cur + dir < 1 || cur + dir > N) { d.blocked = true; return; }

    visible: () => [cur],
    atEnd: () => cur >= N,
    atStart: () => cur <= 1,
    next: () => turn(1),
    prev: () => turn(-1),
    goTo(p) { if (busyAnim) return; cur = p; mountOnly(cur); emitChange(); },
    shift: () => 0,
    resize() { size(); },
  };

  $("eraserPop").hidden = true;
  if (b.dataset.erase === "part") return setTool("eraser");
  const list = annAll[annPage] || [];
  if (!list.length) return hint("لا توجد كتابات في هذه الصفحة");
  if (!confirm("مسح كل الكتابات في الصفحة " + ar(annPage) + " فقط؟")) return;
  annUndo.push(list.slice()); annAll[annPage] = []; annDirty.add(annPage); annSave(); redrawInk(); hint("تم مسح كتابات الصفحة " + ar(annPage));
});
document.addEventListener("click", (e) => { if (!e.target.closest("#eraserPop")) $("eraserPop").hidden = true; });

function redrawInk() { ictx.clearRect(0, 0, ink.width, ink.height); drawAnn(ictx, annPage, ink.width, ink.height); }
function commit(list) { annUndo.push((annAll[annPage] || []).slice()); annAll[annPage] = list; annDirty.add(annPage); annSave(); redrawInk(); }
$("annUndo").onclick = () => { closeTextBox(true); if (!annUndo.length) return hint("لا يوجد ما يمكن التراجع عنه"); annAll[annPage] = annUndo.pop(); annDirty.add(annPage); annSave(); redrawInk(); };

async function loadAnnPage(p) {
  closeTextBox(); annPage = p; annUndo = [];
  $("annTitle").textContent = book.title + " — صفحة " + ar(p);
  document.querySelectorAll("#annPages button").forEach((b) => b.classList.toggle("on", +b.dataset.p === p));
  const st = $("annStage"), maxW = st.clientWidth - 24, maxH = st.clientHeight - 24;
  annW = Math.floor(Math.min(maxW, maxH * RATIO)); annH = Math.floor(annW / RATIO);
  const sh = $("annSheet"); sh.style.width = annW + "px"; sh.style.height = annH + "px";
  [base, ink].forEach((c) => { c.width = Math.round(annW * DPR); c.height = Math.round(annH * DPR); });
  const page = await pdf.getPage(p), vp0 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: base.width / vp0.width });
  const bctx = base.getContext("2d", { alpha: false }); bctx.direction = "ltr"; bctx.fillStyle = "#fff"; bctx.fillRect(0, 0, base.width, base.height);
  await page.render({ canvasContext: bctx, viewport: vp }).promise;
  redrawInk();
}
function openAnn() {
  const v = visiblePages().slice().sort((a, b) => a - b); if (!v.length) return;
  $("ann").hidden = false; document.body.classList.add("ann-open"); annDirty.clear();
  const pg = $("annPages"); pg.innerHTML = "";
  if (v.length > 1) v.forEach((p) => { const b = document.createElement("button"); b.dataset.p = p; b.textContent = "صفحة " + ar(p); b.onclick = () => loadAnnPage(p); pg.appendChild(b); });
  setTool(annTool); loadAnnPage(v[0]);
}
function closeAnn() {
  closeTextBox(true); $("ann").hidden = true; document.body.classList.remove("ann-open");
  annDirty.forEach((p) => { rendered.delete(p); want(p); }); annDirty.clear();
}
$("annBtn").onclick = openAnn; $("annClose").onclick = closeAnn; $("annDone").onclick = closeAnn;
let annLastW = window.innerWidth;
window.addEventListener("resize", () => {
  if ($("ann").hidden) return;
  if (Math.abs(window.innerWidth - annLastW) < 2) return; // تغيّر الارتفاع فقط = ظهور الكيبورد
  annLastW = window.innerWidth; if (!ebox && !inputCb) loadAnnPage(annPage);
});

// الرسم والمسح
const pos = (e) => { const r = ink.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
let drawing = null;
ink.addEventListener("pointerdown", (e) => {
  if (e.button > 0) return; e.preventDefault();
  if (annTool === "text") return textTap(e);
  ink.setPointerCapture(e.pointerId);
  if (annTool === "pen") { drawing = { t: "s", c: annColor, w: 0.006, p: [pos(e)] }; }
  else { lastErase = null; drawing = { erase: true, before: (annAll[annPage] || []).slice(), changed: false }; eraseAt(pos(e)); }
});
ink.addEventListener("pointermove", (e) => {
  if (!drawing) return;
  if (drawing.erase) return eraseAt(pos(e));
  const pt = pos(e), last = drawing.p[drawing.p.length - 1];
  if (Math.hypot(pt[0] - last[0], pt[1] - last[1]) < 0.0015) return;
  drawing.p.push(pt);
  ictx.save(); ictx.strokeStyle = drawing.c; ictx.lineWidth = drawing.w * ink.width; ictx.lineCap = "round";
  ictx.beginPath(); ictx.moveTo(last[0] * ink.width, last[1] * ink.height); ictx.lineTo(pt[0] * ink.width, pt[1] * ink.height); ictx.stroke(); ictx.restore();
});
const endDraw = () => {
  if (!drawing) return;
  if (drawing.erase) { if (drawing.changed) { annUndo.push(drawing.before); annDirty.add(annPage); annSave(); } }
  else { const l = (annAll[annPage] || []).slice(); l.push({ ...drawing, p: drawing.p.map(([x, y]) => [+x.toFixed(4), +y.toFixed(4)]) }); commit(l); }
  drawing = null;
};
ink.addEventListener("pointerup", endDraw); ink.addEventListener("pointercancel", endDraw);
function segDist(px, py, ax, ay, bx, by) { // مسافة نقطة عن قطعة مستقيمة (بوحدة عرض الصفحة)
  const k = 1 / RATIO; ay *= k; by *= k; py *= k;
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  let t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function hitItem(it, x, y, R) {
  if (it.t === "s") {
    if (it.p.length === 1) return segDist(x, y, it.p[0][0], it.p[0][1], it.p[0][0], it.p[0][1]) < R + it.w;
    for (let i = 1; i < it.p.length; i++) if (segDist(x, y, it.p[i - 1][0], it.p[i - 1][1], it.p[i][0], it.p[i][1]) < R + it.w) return true;
    return false;
  }
  const lines = String(it.v).split("\n"), wid = textK(it) * it.s, hei = lines.length * it.s * 1.35 * RATIO;
  return x <= it.x + R && x >= it.x - wid - R && y >= it.y - R && y <= it.y + hei + R;
}
let lastErase = null;
function eraseAt([x, y]) {
  const R = 0.02, list = annAll[annPage] || [];
  // نمرّ على كل المسار بين آخر نقطتين حتى لا تفوت الممحاة أي خط
  const pts = [[x, y]];
  if (lastErase) { const n = Math.ceil(Math.hypot(x - lastErase[0], (y - lastErase[1]) / RATIO) / (R / 2)); for (let i = 1; i < n; i++) pts.push([lastErase[0] + (x - lastErase[0]) * i / n, lastErase[1] + (y - lastErase[1]) * i / n]); }
  lastErase = [x, y];
  const keep = list.filter((it) => !pts.some(([a, b]) => hitItem(it, a, b, R)));
  if (keep.length !== list.length) { annAll[annPage] = keep; drawing.changed = true; redrawInk(); }
}

// ===== النص: نكتبه أولاً، ثم يظهر مربعاً يُحرَّك ويُكبَّر ويُحذف =====
let ebox = null, inputCb = null;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function textK(it) { // عرض النص نسبةً لحجم الخط
  ictx.save(); ictx.font = '600 100px "Plex", system-ui, sans-serif';
  const k = Math.max(...String(it.v).split("\n").map((l) => ictx.measureText(l).width)) / 100; ictx.restore(); return k || 0.5;
}
function placeInputAboveKeyboard() {
  const vv = window.visualViewport, box = $("annInput");
  if (!vv) return; box.style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + "px";
}
if (window.visualViewport) { visualViewport.addEventListener("resize", placeInputAboveKeyboard); visualViewport.addEventListener("scroll", placeInputAboveKeyboard); }
function showPin(x, y) {
  let pin = $("annPin"); if (!pin) { pin = document.createElement("div"); pin.id = "annPin"; pin.className = "ann-pin"; $("annSheet").appendChild(pin); }
  Object.assign(pin.style, { left: x * annW + "px", top: y * annH + "px", background: annColor }); pin.hidden = false;
}
function openInput(val, cb) {
  inputCb = cb; const ta = $("annInputTa"); ta.value = val || ""; ta.style.color = ebox ? ebox.it.c : annColor;
  $("annInputAdd").textContent = val ? "حفظ" : "إضافة";
  $("annInput").hidden = false; placeInputAboveKeyboard(); ta.focus();
}
function closeInput(ok) {
  if (!inputCb) return; const cb = inputCb; inputCb = null;
  const ta = $("annInputTa"), v = ta.value.trim(); ta.blur();
  $("annInput").hidden = true; const pin = $("annPin"); if (pin) pin.hidden = true;
  cb(ok ? v : null);
}
$("annInputAdd").addEventListener("click", () => closeInput(true));
$("annInputCancel").addEventListener("click", () => closeInput(false));
$("annInputTa").addEventListener("keydown", (k) => {
  if (k.key === "Enter" && !k.shiftKey) { k.preventDefault(); closeInput(true); }
  if (k.key === "Escape") { k.stopPropagation(); closeInput(false); }
});
// ضغطة على الصفحة بأداة النص
function textTap(e) {
  const [x, y] = pos(e);
  if (inputCb) { if (!ebox) showPin(x, y); return; }
  if (ebox) return finishEdit(true);
  const list = annAll[annPage] || [];
  for (let i = list.length - 1; i >= 0; i--) if (list[i].t === "x" && hitItem(list[i], x, y, 0.012)) return openEdit(i);
  showPin(x, y);
  const at = { x, y };
  openInput("", (v) => {
    if (!v) return;
    const pin = $("annPin"); if (pin && pin.style.left) { at.x = parseFloat(pin.style.left) / annW; at.y = parseFloat(pin.style.top) / annH; }
    const it = { t: "x", c: annColor, x: at.x, y: at.y, s: Math.max(13, Math.round(annW * 0.032)) / annW, v };
    it.x = clamp(it.x, Math.min(1, textK(it) * it.s + 0.02), 1);
    openEditItem(it, (annAll[annPage] || []).slice(), true);
  });
}
function openEdit(i) {
  const list = annAll[annPage] || [], before = list.slice(), it = { ...list[i] };
  annAll[annPage] = list.filter((_, j) => j !== i); redrawInk();
  openEditItem(it, before, false);
}
function openEditItem(it, before, isNew) {
  const el = document.createElement("div"); el.className = "ann-ebox";
  el.innerHTML = '<div class="ann-etext"></div>' +
    '<button class="eb eb-x" aria-label="حذف النص" title="حذف">✕</button>' +
    '<button class="eb eb-ok" aria-label="تم" title="تم">✓</button>' +
    '<button class="eb eb-ed" aria-label="تعديل النص" title="تعديل النص">✎</button>' +
    '<span class="eb-rs" aria-label="تكبير وتصغير" title="اسحب للتكبير والتصغير"></span>';
  $("annSheet").appendChild(el);
  ebox = { el, it, before, page: annPage, t0: performance.now() };
  const fresh = () => !ebox || performance.now() - ebox.t0 < 450; // تجاهل نفس الضغطة التي فتحت المربع
  layoutBox();
  el.querySelector(".eb-x").onclick = (e) => { e.stopPropagation(); if (!fresh()) finishEdit(false); };
  el.querySelector(".eb-ok").onclick = (e) => { e.stopPropagation(); if (!fresh()) finishEdit(true); };
  el.querySelector(".eb-ed").onclick = (e) => { e.stopPropagation(); if (fresh()) return; openInput(it.v, (v) => { if (v && ebox) { ebox.it.v = v; layoutBox(); } }); };
  el.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest("button")) return;
    ev.preventDefault(); ev.stopPropagation(); el.setPointerCapture(ev.pointerId);
    const rs = ev.target.classList.contains("eb-rs"), r = $("annSheet").getBoundingClientRect();
    const st = { cx: ev.clientX, cy: ev.clientY, x: it.x, y: it.y, s: it.s, ax: r.left + it.x * r.width, ay: r.top + it.y * r.height };
    st.d = Math.max(8, Math.hypot(ev.clientX - st.ax, ev.clientY - st.ay));
    el.classList.add(rs ? "sizing" : "moving");
    const mv = (m) => {
      if (rs) it.s = clamp(st.s * Math.hypot(m.clientX - st.ax, m.clientY - st.ay) / st.d, 0.012, 0.16);
      else { it.x = clamp(st.x + (m.clientX - st.cx) / r.width, 0.03, 1); it.y = clamp(st.y + (m.clientY - st.cy) / r.height, 0, 0.97); }
      layoutBox();
    };
    const up = () => { el.classList.remove("sizing", "moving"); el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); };
    el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  });
  hint(isNew ? "اسحب النص لتحريكه، والزاوية لتكبيره، ثم اضغط ✓" : "حرّك النص أو كبّره، ثم اضغط ✓");
}
function layoutBox() {
  if (!ebox) return; const { el, it } = ebox, fs = it.s * annW, t = el.querySelector(".ann-etext");
  t.textContent = it.v; t.style.fontSize = fs + "px"; t.style.color = it.c;
  el.style.setProperty("--c", it.c);
  el.style.right = (1 - it.x) * annW + "px"; el.style.top = it.y * annH + "px";
  el.style.marginTop = -(8 + fs * 0.175) + "px"; el.style.marginRight = "-8px";
}
function finishEdit(save) {
  if (!ebox) return; const b = ebox; ebox = null; b.el.remove();
  if (inputCb) { inputCb = null; $("annInput").hidden = true; $("annInputTa").blur(); }
  let list = (annAll[b.page] || []).slice();
  const it = b.it;
  if (save && it.v) list.push({ t: "x", c: it.c, x: +it.x.toFixed(4), y: +it.y.toFixed(4), s: +it.s.toFixed(4), v: it.v });
  annAll[b.page] = list;
  if (JSON.stringify(list) !== JSON.stringify(b.before)) { if (b.page === annPage) annUndo.push(b.before); annDirty.add(b.page); annSave(); hint(save ? "تم حفظ النص" : "تم حذف النص"); }
  if (b.page === annPage) redrawInk();
}
function closeTextBox() { closeInput(false); finishEdit(true); }

// ===== التكبير =====
let zLevel = 1, zPages = [];
let zToken = 0;
async function drawZoom() {
  const token = ++zToken;
  $("zLevel").textContent = Math.round(zLevel * 100) + "%";
  const box = $("zPages"); box.innerHTML = "";
  const fitW = Math.min(window.innerWidth - 32, 900) / (zPages.length > 1 && window.innerWidth > 700 ? 2 : 1);
  const w = Math.round(fitW * zLevel);
  for (const p of zPages) {
    const page = await pdf.getPage(p);
    const vp0 = page.getViewport({ scale: 1 });
    const scale = (w * DPR) / vp0.width;
    const vp = page.getViewport({ scale });
    const c = document.createElement("canvas");
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    c.style.width = w + "px"; c.style.height = Math.round(w / RATIO) + "px";
    c.dir = "ltr";
    const zctx = c.getContext("2d", { alpha: false }); zctx.direction = "ltr";
    zctx.fillStyle = "#fff"; zctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: zctx, viewport: vp }).promise;
    drawAnn(zctx, p, c.width, c.height);
    if (token !== zToken) return;
    box.appendChild(c);
  }
}
function openZoom() { zPages = visiblePages(); zLevel = 1; $("zoom").classList.add("open"); drawZoom(); }
function closeZoom() { $("zoom").classList.remove("open"); $("zPages").innerHTML = ""; }
$("zoomBtn").onclick = openZoom;
$("zClose").onclick = closeZoom;
$("zIn").onclick = () => { if (zLevel < 3) { zLevel = +(zLevel + 0.5).toFixed(1); drawZoom(); } };
$("zOut").onclick = () => { if (zLevel > 1) { zLevel = +(zLevel - 0.5).toFixed(1); drawZoom(); } };
</script>
</body>
</html>
