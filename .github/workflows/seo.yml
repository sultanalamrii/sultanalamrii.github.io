name: تحديث صفحات محركات البحث
on:
  push:
    branches: [main]
    paths:
      - "books.json"
      - "books/**"
      - "tools/build_seo.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تثبيت الأدوات
        run: pip install --quiet pymupdf pillow
      - name: توليد صفحات الكتب و sitemap و llms.txt
        run: python3 tools/build_seo.py
      - name: حفظ التغييرات (فقط إذا فيه جديد)
        run: |
          git add -A kitab index.html sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير"
            exit 0
          fi
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git commit -m "تحديث صفحات محركات البحث"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
