name: تحديث إحصاءات الدول
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: جلب الإحصاءات
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 tools/update_stats.py
      - name: حفظ الملف
        run: |
          if [ -n "$(git status --porcelain stats.json)" ]; then
            git config user.name "stats-bot"
            git config user.email "stats-bot@users.noreply.github.com"
            git add stats.json
            git commit -m "تحديث إحصاءات الدول"
            git pull --rebase origin main
            git push
          fi
